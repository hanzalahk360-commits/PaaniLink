<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PaaniLink: Administrator</title><link rel="stylesheet" href="style.css"></head><body data-page="admin"><header class="top"><a href="index.html" class="brand">PaaniLink</a><div id="who"></div></header><main><p id="msg" role="status" aria-live="polite"></p><h1>City reports and setup</h1><section id="rep"></section><h2>Update rates</h2><form id="rf" novalidate><label for="rsel">Tanker size</label><select id="rsel" name="id" required></select><label for="rc">Commercial rate (Rs)</label><input id="rc" name="commercial" type="number" min="1" required><label for="rs">Subsidised rate (Rs)</label><input id="rs" name="subsidised" type="number" min="1" required><button type="submit">Save rates</button></form><h2>Update hydrant quota</h2><form id="qf" novalidate><label for="qsel">Hydrant</label><select id="qsel" name="id" required></select><label for="qv">Daily quota (gallons)</label><input id="qv" name="quota" type="number" min="1000" required><button type="submit">Save quota</button></form><h2>Rates</h2><div id="rt"></div><h2>Hydrants</h2><div id="hyd"></div><h2>Tankers</h2><div id="tnk"></div><h2>Users</h2><div id="usr"></div></main><script src="common.js"></script><script src="admin.js"></script></body></html>
