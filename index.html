<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PaaniLink: Log in</title><link rel="stylesheet" href="style.css"></head><body data-page="index"><header class="top"><a href="index.html" class="brand">PaaniLink</a><div id="who"></div></header><main><p id="msg" role="status" aria-live="polite"></p><h1>Welcome to PaaniLink</h1><form id="lf" novalidate><h2>Log in</h2><label for="acct">Account</label><select id="acct" required></select><button type="submit">Log in</button></form><form id="rg" novalidate><h2>New customer? Register</h2><label for="name">Full name</label><input id="name" name="name" autocomplete="name" required><label for="cnic">CNIC (13 digits)</label><input id="cnic" name="cnic" inputmode="numeric" maxlength="13" required><label for="phone">Phone</label><input id="phone" name="phone" type="tel" placeholder="03XXXXXXXXX" required><label for="address">Address</label><input id="address" name="address" required><label for="zone">Zone</label><select id="zone" name="zoneId" required></select><button type="submit">Register and continue</button></form></main><script src="common.js"></script><script src="index.js"></script></body></html>
